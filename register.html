<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — OrionCinemas</title>
<link rel="stylesheet" href="assets/css/register.css">
</head>
<body>

<canvas id="particles"></canvas>

<nav>
  <a class="logo" href="index.html">
    <img src="assets/images/vectors/orion-logo.svg" alt="" width="36" height="36" class="logo-pulse logo-glow">
    <span class="logo-text"><span class="brand-highlight">Orion</span>Cinemas</span>
  </a>
  <ul class="nav-links">
    <li><a href="index.html#movies">Now Showing</a></li>
    <li><a href="index.html#experiences">Experiences</a></li>
  </ul>
  <div class="nav-actions">
    <a class="btn-ghost" href="login.html">Login</a>
  </div>
</nav>
<button type="button" class="motion-toggle" id="motionToggle" hidden>Pause animations</button>

<main>
  <div class="card">
    <div class="card-header">
      <div class="card-icon" aria-hidden="true">
        <img src="assets/images/vectors/film-icon.svg" alt="">
      </div>
      <h1 class="card-title">Create Account</h1>
    </div>

    <form method="post">

      <div class="row name-row">
        <div class="field">
          <label for="first_name">First Name</label>
          <div class="input-wrap">
            <input type="text" id="first_name" name="first_name"
                   placeholder="Juan" autocomplete="given-name" required>
            <span class="icon" aria-hidden="true"><img src="assets/images/vectors/user-icon.svg" alt=""></span>
          </div>
        </div>
        <div class="field">
          <label for="middle_name">Middle Name (optional)</label>
          <div class="input-wrap">
            <input type="text" id="middle_name" name="middle_name"
                   placeholder="Santos" autocomplete="additional-name">
            <span class="icon" aria-hidden="true"><img src="assets/images/vectors/user-icon.svg" alt=""></span>
          </div>
        </div>
        <div class="field">
          <label for="last_name">Last Name</label>
          <div class="input-wrap">
            <input type="text" id="last_name" name="last_name"
                   placeholder="dela Cruz" autocomplete="family-name" required>
            <span class="icon" aria-hidden="true"><img src="assets/images/vectors/user-icon.svg" alt=""></span>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="phone">Phone (optional)</label>
          <div class="input-wrap">
            <input type="tel" id="phone" name="phone"
                   placeholder="+63 9XX XXX XXXX" autocomplete="tel">
            <span class="icon" aria-hidden="true"><img src="assets/images/vectors/phone-icon.svg" alt=""></span>
          </div>
        </div>
      </div>

      <div class="field">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <input type="email" id="email" name="email"
                 placeholder="you@example.com"
                 autocomplete="email" required>
          <span class="icon" aria-hidden="true"><img src="assets/images/vectors/email-icon.svg" alt=""></span>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap password-field">
          <input class="password-input" type="password" id="password" name="password"
                 placeholder="Min. 8 characters" minlength="8" autocomplete="new-password" aria-describedby="strength-label" required>
          <span class="icon" aria-hidden="true"><img src="assets/images/vectors/lock-icon.svg" alt=""></span>
          <button type="button" class="toggle-pw" data-password-target="password" aria-label="Show password" aria-pressed="false">
            <img class="icon-eye" src="assets/images/vectors/eye-icon.svg" alt="" aria-hidden="true">
            <img class="icon-eye-off" src="assets/images/vectors/eye-off-icon.svg" alt="" aria-hidden="true">
          </button>
        </div>
        <div id="strength-bar" role="meter" aria-label="Password strength" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0">
          <div id="strength-fill"></div>
        </div>
        <div id="strength-label" aria-live="polite"></div>
      </div>

      <div class="field">
        <label for="confirm_password">Confirm Password</label>
        <div class="input-wrap password-field">
          <input class="password-input" type="password" id="confirm_password" name="confirm_password"
                 placeholder="Repeat your password" minlength="8" autocomplete="new-password" required>
          <span class="icon" aria-hidden="true"><img src="assets/images/vectors/key-icon.svg" alt=""></span>
          <button type="button" class="toggle-pw" data-password-target="confirm_password" aria-label="Show password" aria-pressed="false">
            <img class="icon-eye" src="assets/images/vectors/eye-icon.svg" alt="" aria-hidden="true">
            <img class="icon-eye-off" src="assets/images/vectors/eye-off-icon.svg" alt="" aria-hidden="true">
          </button>
        </div>
      </div>

      <div class="check-row">
        <input type="checkbox" id="terms" name="terms" aria-label="I agree to the Terms and Conditions and Privacy Policy" aria-describedby="terms-feedback" required>
        <label for="terms" class="terms-label">I agree to the</label>
        <button type="button" class="terms-link" data-legal-document="terms">Terms &amp; Conditions</button>
        <span>and</span>
        <button type="button" class="terms-link" data-legal-document="privacy">Privacy Policy</button>
      </div>
      <p class="terms-feedback" id="terms-feedback" aria-live="polite"></p>

      <button type="submit" class="btn-submit" id="submitBtn" disabled>Create Account</button>

      <p class="sign-in-link sign-in-link-form">
        Already have an account? <a href="login.html">Log in</a>
      </p>
    </form>
  </div>
</main>

<dialog class="legal-dialog" id="legalDialog" aria-labelledby="legalDialogTitle" aria-describedby="legalDialogContent">
  <div class="legal-dialog-header">
    <h2 id="legalDialogTitle"></h2>
    <button type="button" class="legal-dialog-close" aria-label="Close dialog">×</button>
  </div>
  <div class="legal-dialog-content" id="legalDialogContent"></div>
</dialog>

<footer>© 2025 OrionCinemas. All rights reserved.</footer>

<script src="assets/js/validation.js"></script>
<script src="assets/js/register.js"></script>
</body>
</html>
